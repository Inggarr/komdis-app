name: Deploy Web Dinamis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'web-dinamis/**'
      - '.github/workflows/deploy-dinamis.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./web-dinamis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          source: "web-dinamis/docker-compose.yml"
          target: "/home/${{ secrets.AWS_USERNAME }}/komdis-dinamis/"
          strip_components: 1

      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.AWS_USERNAME }}/komdis-dinamis

            # Buat file .env dari secrets
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_ROOT_PASS=${{ secrets.DB_ROOT_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            EOF

            # Pull image terbaru & deploy ulang dengan docker compose
            docker compose pull app
            docker compose up -d --remove-orphans

            # Tunggu db sehat (healthcheck sudah handle ini, tapi kita verifikasi)
            echo "Menunggu DB siap..."
            sleep 10

            # Import skema database
            echo "Import skema database..."
            docker compose cp app:/var/www/html/db_tambahan.sql /tmp/db_tambahan.sql || true
            docker compose exec -T db mysql \
              -u"${{ secrets.DB_USER }}" \
              -p"${{ secrets.DB_PASS }}" \
              "${{ secrets.DB_NAME }}" \
              < /tmp/db_tambahan.sql || echo "Skema sudah ada / gagal import"

            # Pastikan folder upload ada dan punya permission benar
            docker compose exec app bash -c \
              "mkdir -p /var/www/html/assets/upload/berita \
               /var/www/html/assets/upload/profil \
               /var/www/html/assets/upload/bukti \
               && chmod -R 777 /var/www/html/assets/upload \
               && chown -R www-data:www-data /var/www/html/assets/upload"

            echo "Deploy selesai!"
            docker compose ps
