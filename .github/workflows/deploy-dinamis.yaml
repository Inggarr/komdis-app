name: Deploy Web Dinamis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'web-dinamis/**'
      - '.github/workflows/deploy-dinamis.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-dinamis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            # Buat docker network jika belum ada
            docker network create komdis-network || true

            # Mengatur defaults jika GitHub Secrets kosong
            DB_ROOT_PASS_VAL="${{ secrets.DB_ROOT_PASS }}"
            DB_NAME_VAL="${{ secrets.DB_NAME }}"
            DB_USER_VAL="${{ secrets.DB_USER }}"
            DB_PASS_VAL="${{ secrets.DB_PASS }}"

            [ -z "$DB_ROOT_PASS_VAL" ] && DB_ROOT_PASS_VAL="rootpass123"
            [ -z "$DB_NAME_VAL" ] && DB_NAME_VAL="dbkomdis"
            [ -z "$DB_USER_VAL" ] && DB_USER_VAL="userkomdis"
            [ -z "$DB_PASS_VAL" ] && DB_PASS_VAL="12345"

            # Selalu stop dan jalankan ulang container DB agar terjamin berada di network yang sama
            # Menggunakan volume komdis-db-data agar data MySQL aman tidak terhapus
            docker rm -f komdis-db || true
            docker run -d \
              --name komdis-db \
              --network komdis-network \
              -e MYSQL_ROOT_PASSWORD="$DB_ROOT_PASS_VAL" \
              -e MYSQL_DATABASE="$DB_NAME_VAL" \
              -e MYSQL_USER="$DB_USER_VAL" \
              -e MYSQL_PASSWORD="$DB_PASS_VAL" \
              -v komdis-db-data:/var/lib/mysql \
              mariadb:10.11

            echo "Menunggu MariaDB siap..."
            sleep 15

            # Deploy PHP app
            docker rm -f komdis-app-dinamis || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest
            docker run -d \
              --name komdis-app-dinamis \
              --network komdis-network \
              -p 8080:80 \
              -e DB_HOST=komdis-db \
              -e DB_USER="$DB_USER_VAL" \
              -e DB_PASS="$DB_PASS_VAL" \
              -e DB_NAME="$DB_NAME_VAL" \
              ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest

            echo "Menunggu aplikasi siap..."
            sleep 5

            # Salin file SQL skema dari container PHP ke host, lalu import ke container MariaDB
            echo "Meng-import skema database..."
            docker cp komdis-app-dinamis:/var/www/html/db_tambahan.sql /tmp/db_tambahan.sql || true
            docker exec -i komdis-db mysql -u "$DB_USER_VAL" -p"$DB_PASS_VAL" "$DB_NAME_VAL" < /tmp/db_tambahan.sql || echo "Gagal import database"
