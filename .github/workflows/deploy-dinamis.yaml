name: Deploy Web Dinamis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'web-dinamis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-dinamis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            # Buat docker network jika belum ada
            docker network create komdis-network || true

            # Jalankan MariaDB container jika belum berjalan
            if ! docker ps --format '{{.Names}}' | grep -q '^komdis-db$'; then
              docker rm -f komdis-db || true
              docker run -d \
                --name komdis-db \
                --network komdis-network \
                -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASS }} \
                -e MYSQL_DATABASE=${{ secrets.DB_NAME }} \
                -e MYSQL_USER=${{ secrets.DB_USER }} \
                -e MYSQL_PASSWORD=${{ secrets.DB_PASS }} \
                -v komdis-db-data:/var/lib/mysql \
                mariadb:10.11
              echo "Menunggu MariaDB siap..."
              sleep 20
            fi

            # Deploy PHP app
            docker rm -f komdis-app-dinamis || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest
            docker run -d \
              --name komdis-app-dinamis \
              --network komdis-network \
              -p 8080:80 \
              -e DB_HOST=komdis-db \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASS=${{ secrets.DB_PASS }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app-dinamis:latest
