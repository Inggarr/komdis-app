name: Deploy Web Statis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'web-statis/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./web-statis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            # Buat direktori kerja
            mkdir -p /home/$USER/komdis-statis
            cd /home/$USER/komdis-statis

            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"

            # Tulis .env
            cat > .env << ENVEOF
            DOCKERHUB_USERNAME=${DOCKER_USER}
            ENVEOF

            # Tulis docker-compose.yml langsung di server
            cat > docker-compose.yml << 'COMPOSEEOF'
            version: '3.8'

            services:
              app:
                image: ${DOCKERHUB_USERNAME}/komdis-app:latest
                container_name: komdis-app
                restart: unless-stopped
                ports:
                  - "80:80"

            networks:
              default:
                driver: bridge
            COMPOSEEOF

            # Deteksi docker compose v2 atau v1
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo "Menggunakan: $COMPOSE_CMD"

            # Login Docker Hub di server
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKER_USER" --password-stdin

            # Pull image terbaru & deploy
            $COMPOSE_CMD pull app
            $COMPOSE_CMD up -d --remove-orphans

            echo "=== Deploy web statis selesai! ==="
            $COMPOSE_CMD ps
