name: Deploy Komdis App to AWS EC2

on:
push:
branches: [ main ]

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Build and Push Image
  uses: docker/build-push-action@v5
  with:
    context: ./komdis-app
    push: true
    tags: ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app:latest
```

deploy:
needs: build-and-deploy
runs-on: ubuntu-latest

```
steps:
- name: Deploy to EC2
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.AWS_HOST }}
    username: ${{ secrets.AWS_USERNAME }}
    key: ${{ secrets.AWS_PRIVATE_KEY }}
    port: 22
    script: |
      docker rm -f komdis-app || true
      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app:latest
      docker run -d --name komdis-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/komdis-app:latest
```
